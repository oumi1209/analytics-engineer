bundle:
  name: analytics-engineer

include:
  - resources/*.yml

sync:
  include:
    - src/**
    - resources/**
    - notebooks/**
    - pyproject.toml
    - uv.lock
    - config.yaml
  exclude:
    - ".git/**"
    - "__pycache__/**"
    - ".databricks/**"
    - ".vscode/**"
    - "dist/**"

artifacts:
  analytics_engineer_wheel:
    type: whl
    build: uv build --wheel
    path: .

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://dbc-e30aefd6-ab32.cloud.databricks.com
      root_path: ~/.bundle/analytics-engineer/dev_clean_3
      artifact_path: /Volumes/sncf_gc/bronze/landing/artifacts/${workspace.current_user.short_name}
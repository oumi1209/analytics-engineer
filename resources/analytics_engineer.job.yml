# Job definition for the Medallion pipeline (serverless compute).
# Databricks serverless manages compute automatically — no cluster sizing needed.

resources:
  jobs:
    medallion_pipeline:
      name: medallion-pipeline

      environments:
        - environment_key: pipeline_env
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: bronze
          environment_key: pipeline_env
          python_wheel_task:
            package_name: analytics_engineer
            entry_point: analytics-engineer
            parameters:
              - "--stage"
              - "bronze"
              - "--config"
              - "${workspace.root_path}/files/config.yaml"

        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: pipeline_env
          python_wheel_task:
            package_name: analytics_engineer
            entry_point: analytics-engineer
            parameters:
              - "--stage"
              - "silver"
              - "--config"
              - "${workspace.root_path}/files/config.yaml"
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: pipeline_env
          python_wheel_task:
            package_name: analytics_engineer
            entry_point: analytics-engineer
            parameters:
              - "--stage"
              - "gold"
              - "--config"
              - "${workspace.root_path}/files/config.yaml"